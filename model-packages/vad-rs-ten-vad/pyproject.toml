[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vad-rs-ten-vad"
version = "0.1.0"
description = "TEN VAD model weights for vad-rs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nick Lackman" }]
keywords = ["vad", "voice activity detection", "ten-vad", "speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/nicklackman/vad-rs"

[tool.hatch.build.targets.wheel]
packages = ["vad_rs_ten_vad"]

[tool.hatch.build.targets.wheel.force-include]
"vad_rs_ten_vad/ten_vad.onnx" = "vad_rs_ten_vad/ten_vad.onnx"
