[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vad-rs"
version = "0.1.0"
description = "Fast, production-grade Voice Activity Detection with Rust-powered inference"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nick Lackman" }]
keywords = ["vad", "voice activity detection", "speech", "audio", "silero", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/nicklackman/vad-rs"
Repository = "https://github.com/nicklackman/vad-rs"
Issues = "https://github.com/nicklackman/vad-rs/issues"

[project.optional-dependencies]
silero = ["vad-rs-silero>=0.1.0"]
ten-vad = ["vad-rs-ten-vad>=0.1.0"]
dev = [
    "maturin",
    "pytest",
    "vad-rs-silero>=0.1.0",
    "vad-rs-ten-vad>=0.1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "vad_rs._core"